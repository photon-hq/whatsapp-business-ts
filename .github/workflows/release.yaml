name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release:
        type: boolean
        description: "Force release (skip the PR-label check)"
        default: false
      dry-run:
        type: boolean
        description: "Run without publishing"
        default: false

permissions:
  contents: write
  id-token: write
  packages: write
  pull-requests: read

jobs:
  release:
    uses: photon-hq/buildspace/.github/workflows/typescript-service-release.yaml@main
    with:
      service-name: whatsapp-business
      build-command: bun run build
      use-oidc: true
      release: ${{ github.event_name == 'workflow_dispatch' && inputs.release || false }}
      dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs['dry-run'] || false }}
    secrets: inherit
