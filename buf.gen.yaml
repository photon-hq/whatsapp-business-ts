version: v2
inputs:
  - module: buf.build/photon-hq/whatsapp
plugins:
  - local: protoc-gen-ts_proto
    out: src/generated
    opt:
      - outputServices=nice-grpc,outputServices=generic-definitions
      - useExactTypes=false
      - esModuleInterop=true
      - snakeToCamel=true
      - importSuffix=.js
