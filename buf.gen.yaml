version: v2
inputs:
  # Pinned BSR commit (main @ spectrum-whatsapp-business 5a165dd).
  # To pick up schema changes: update the ref, run `bun run generate`, commit both.
  - module: buf.build/photon-hq/whatsapp:96a71c4136794f9aa60ad9a654022919
plugins:
  - local: protoc-gen-ts_proto
    out: src/generated
    opt:
      - outputServices=nice-grpc,outputServices=generic-definitions
      - useExactTypes=false
      - esModuleInterop=true
      - snakeToCamel=true
      - importSuffix=.js
